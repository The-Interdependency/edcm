name: diagnose final metadata fixed point once

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/ucns-edcm-v0-4-discourse-graphs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR merge tree
        uses: actions/checkout@v4
        with:
          path: edcm

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: skill-lib

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture tracked and generated collections
        working-directory: edcm
        run: |
          cp edcm_msdmd.ts /tmp/tracked-edcm-msdmd.ts
          rm .github/workflows/diagnose-msdmd-fixed-point-once.yml
          PYTHONPATH=../skill-lib python ../skill-lib/msdmd/collect.py \
            --root . \
            --repo The-Interdependency/edcm \
            --out /tmp/generated-edcm-msdmd.ts
          sha256sum /tmp/tracked-edcm-msdmd.ts /tmp/generated-edcm-msdmd.ts > /tmp/sha256.txt
          diff -u /tmp/tracked-edcm-msdmd.ts /tmp/generated-edcm-msdmd.ts > /tmp/collection.diff || true

      - name: Upload exact diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: final-msdmd-fixed-point-diagnostic
          path: |
            /tmp/tracked-edcm-msdmd.ts
            /tmp/generated-edcm-msdmd.ts
            /tmp/sha256.txt
            /tmp/collection.diff
          if-no-files-found: error
