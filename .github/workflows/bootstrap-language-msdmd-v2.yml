name: repair language metadata collection root

on:
  push:
    branches: [agent/atomic-molecular-vernacular]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          path: edcm
          fetch-depth: 0

      - name: Check out pinned canonical skill-lib as sibling
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: skill-lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate canonical EDCM-only collection and validate
        run: |
          PYTHONPATH=skill-lib python skill-lib/msdmd/collect.py \
            --root edcm \
            --repo The-Interdependency/edcm \
            --out /tmp/edcm_msdmd.ts
          cp /tmp/edcm_msdmd.ts edcm/edcm_msdmd.ts
          python -m pip install -e edcm pytest
          pytest -q edcm/tests/test_language_embeddings.py
          cd edcm
          python tools/check_metadata_contracts.py

      - name: Commit corrected collection and remove repair workflow
        working-directory: edcm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edcm_msdmd.ts
          git rm .github/workflows/bootstrap-language-msdmd-v2.yml
          git commit -m "fix(msdmd): collect language modules from repository root"
          git push origin HEAD:agent/atomic-molecular-vernacular
