name: materialize EDCM msdmd once

on:
  push:
    branches: [agent/ucns-edcm-experiment-first]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          ref: agent/ucns-edcm-experiment-first
          fetch-depth: 0

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: /tmp/skill-lib

      - name: Generate tracked collection
        run: |
          PYTHONPATH=/tmp/skill-lib python /tmp/skill-lib/msdmd/collect.py \
            --root . \
            --repo The-Interdependency/edcm \
            --out edcm_msdmd.ts
          rm .github/workflows/materialize-edcm-msdmd-once.yml

      - name: Commit exact generated result and remove materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edcm_msdmd.ts .github/workflows/materialize-edcm-msdmd-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh EDCM msdmd collection"
          git push origin HEAD:agent/ucns-edcm-experiment-first
