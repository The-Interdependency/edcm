name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  base-package:
    name: Base package / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run base package tests
        run: python -m pytest -q

  build-and-wheel-smoke:
    name: Build, metadata, and clean-wheel smoke
    runs-on: ubuntu-latest
    needs: base-package

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build source and wheel artifacts
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel into a clean environment
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --upgrade pip
          .wheel-venv/bin/python -m pip install dist/*.whl

      - name: Smoke-test installed public API and package data
        run: |
          .wheel-venv/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files

          import edcm

          assert version("edcm") == edcm.__version__
          assert callable(edcm.build_default_layers)
          assert files("edcm.measurement.canon").joinpath("data", "markers_v1.json").is_file()
          print(f"edcm {edcm.__version__} wheel smoke passed")
          PY
