name: temporary OEWN builder diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/oewn-builder-diagnostic.yml"
      - "tools/build_oewn2025_embeddings.py"
      - "edcm/language/**"
      - "tests/test_language_embeddings.py"
      - "tests/test_language_full_run.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out EDCM diagnostic source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: edcm
          fetch-depth: 0

      - name: Check out exact Open English WordNet release
        uses: actions/checkout@v4
        with:
          repository: globalwordnet/english-wordnet
          ref: 2025-edition
          path: oewn
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install builder dependencies
        working-directory: edcm
        run: python -m pip install -e . pytest PyYAML

      - name: Capture focused repair contracts
        working-directory: edcm
        shell: bash
        run: |
          set +e
          python -m pytest \
            tests/test_language_embeddings.py \
            tests/test_language_full_run.py \
            -q > "$RUNNER_TEMP/oewn-repair-tests.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/oewn-repair-tests.log"
          printf '%s\n' "$status" > "$RUNNER_TEMP/oewn-repair-tests.status"
          exit 0

      - name: Upload focused repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oewn-repair-tests
          path: |
            ${{ runner.temp }}/oewn-repair-tests.log
            ${{ runner.temp }}/oewn-repair-tests.status
          if-no-files-found: error
          retention-days: 7

      - name: Preserve focused repair contract status
        run: test "$(cat "$RUNNER_TEMP/oewn-repair-tests.status")" = "0"

      - name: Run bounded full-corpus diagnostic
        working-directory: edcm
        shell: bash
        run: |
          set +e
          {
            echo "=== host ==="
            date -u
            uname -a
            free -h
            df -h .
            ulimit -a
            echo "=== build ==="
          } > "$RUNNER_TEMP/oewn-builder-diagnostic.log"

          /usr/bin/time -v timeout --signal=TERM --kill-after=30 480 \
            python -u - <<'PY' \
            >> "$RUNNER_TEMP/oewn-builder-diagnostic.log" 2>&1 &
          from pathlib import Path

          from tools.build_oewn2025_embeddings import build

          manifest = build(Path("../oewn"), Path("artifacts"))
          print("BUILD_COMPLETE", manifest["summary"], flush=True)
          PY
          build_pid=$!

          while true; do
            state="$(ps -o stat= -p "$build_pid" 2>/dev/null | tr -d ' ' || true)"
            if [ -z "$state" ] || [[ "$state" == Z* ]]; then
              break
            fi
            sleep 60
            {
              echo "=== sample ==="
              date -u
              ps -eo pid,ppid,etime,rss,vsz,%cpu,cmd --sort=-rss | head -20
              free -h
              df -h .
            } >> "$RUNNER_TEMP/oewn-builder-diagnostic.log"
          done
          wait "$build_pid"
          status=$?

          {
            echo "=== result ==="
            echo "exit_status=$status"
            date -u
            free -h
            df -h .
            echo "=== partial artifact sizes ==="
            du -ah artifacts/oewn2025 2>/dev/null | sort -h | tail -100 || true
            echo "=== partial file inventory ==="
            find artifacts/oewn2025 -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort || true
          } >> "$RUNNER_TEMP/oewn-builder-diagnostic.log"
          printf '%s\n' "$status" > "$RUNNER_TEMP/oewn-builder-diagnostic.status"
          exit 0

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oewn-builder-diagnostic
          path: |
            ${{ runner.temp }}/oewn-builder-diagnostic.log
            ${{ runner.temp }}/oewn-builder-diagnostic.status
          if-no-files-found: error
          retention-days: 7

      - name: Preserve diagnostic exit status
        run: test "$(cat "$RUNNER_TEMP/oewn-builder-diagnostic.status")" = "0"
