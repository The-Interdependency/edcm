name: bootstrap OEWN latest-run concurrency

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-oewn-concurrency.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-oewn-latest-run-concurrency
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Make stale validation runs cancellable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/build-oewn2025-embeddings.yml')
          text = path.read_text(encoding='utf-8')
          old = '  cancel-in-progress: false\n'
          if old not in text:
              raise SystemExit('expected concurrency declaration not found')
          path.write_text(text.replace(old, '  cancel-in-progress: true\n', 1), encoding='utf-8')
          PY

      - name: Commit concurrency repair
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-oewn2025-embeddings.yml
          git commit -m "ci(language): cancel stale validation runs"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:${BRANCH}"
