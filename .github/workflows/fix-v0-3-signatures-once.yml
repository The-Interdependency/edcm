name: fix UCNS-EDCM v0.3 unordered signatures once

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/ucns-edcm-v0-3-scope'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          ref: agent/ucns-edcm-v0-3-scope
          path: edcm
          fetch-depth: 0
      - name: Check out exact UCNS
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/ucns
          ref: 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed
          path: ucns
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canonicalize unordered projections
        working-directory: edcm
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('edcm/ucns_edcm_experiments_v3.py')
          text = path.read_text()
          old = '''def _projection_signature(policy_name: str, projection: Any) -> str:\n    return _digest(_canonical_projection_view(policy_name, projection))\n'''
          new = '''def _projection_signature(policy_name: str, projection: Any) -> str:\n    if policy_name.endswith("multiset"):\n        view = tuple(\n            sorted((str(group.key), int(group.count)) for group in projection.view)\n        )\n    elif policy_name.endswith("set"):\n        view = tuple(sorted(str(entry.key) for entry in projection.view))\n    else:\n        view = _jsonable(projection.view)\n    return _digest(view)\n'''
          if old not in text:
              raise SystemExit('projection signature function not found')
          path.write_text(text.replace(old, new))
          PY
          rm -f .github/workflows/diagnose-v0-3-once.yml
          rm .github/workflows/fix-v0-3-signatures-once.yml
          python -m py_compile edcm/ucns_edcm_experiments_v3.py
      - name: Install and run unchanged witnesses
        run: |
          python -m pip install ./ucns
          python -m pip install -e ./edcm[dev]
          cd edcm
          UCNS_SOURCE_ROOT=../ucns python -m pytest -q tests/test_ucns_edcm_experiments_v3.py
      - name: Commit fix and remove temporary workflows
        working-directory: edcm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edcm/ucns_edcm_experiments_v3.py \
            .github/workflows/diagnose-v0-3-once.yml \
            .github/workflows/fix-v0-3-signatures-once.yml
          git commit -m "fix: canonicalize unordered scope signatures"
          git push origin HEAD:agent/ucns-edcm-v0-3-scope
