name: materialize UCNS-EDCM report once

on:
  push:
    branches: [agent/ucns-edcm-experiment-first]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          ref: agent/ucns-edcm-experiment-first
          fetch-depth: 0

      - name: Check out exact UCNS experiment authority
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/ucns
          ref: 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed
          path: /tmp/ucns

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and reproduce report
        run: |
          python -m pip install --upgrade pip
          python -m pip install /tmp/ucns
          python -m pip install -e .[dev]
          mkdir -p experiments/results
          python -m edcm.ucns_edcm_experiments \
            --edcm-commit 5d15592d509a760ff9fbcdd346a2e749537bb2ba \
            --ucns-commit 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed \
            --output experiments/results/2026-07-21-ucns-edcm-v0.1.0.json
          python -m edcm.ucns_edcm_experiments \
            --edcm-commit 5d15592d509a760ff9fbcdd346a2e749537bb2ba \
            --ucns-commit 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed \
            --output /tmp/ucns-edcm-repeat.json
          diff -u experiments/results/2026-07-21-ucns-edcm-v0.1.0.json /tmp/ucns-edcm-repeat.json
          rm .github/workflows/materialize-ucns-edcm-report-once.yml

      - name: Commit evidence and remove materializer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results/2026-07-21-ucns-edcm-v0.1.0.json \
            .github/workflows/materialize-ucns-edcm-report-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: record initial UCNS-EDCM experiment report"
          git push origin HEAD:agent/ucns-edcm-experiment-first
