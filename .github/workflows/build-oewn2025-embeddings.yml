name: build OEWN 2025 embeddings

on:
  push:
    branches: [agent/oewn2025-complete-embedding]
    paths:
      - ".github/workflows/build-oewn2025-embeddings.yml"
      - "edcm/language/**"
      - "tools/build_oewn2025_embeddings.py"
      - "tools/finalize_oewn2025_artifacts.py"
      - "tests/test_language_full_run.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oewn2025-complete-embedding
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          path: edcm
          fetch-depth: 0

      - name: Check out exact Open English WordNet release
        uses: actions/checkout@v4
        with:
          repository: globalwordnet/english-wordnet
          ref: 2025-edition
          path: oewn
          fetch-depth: 1

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: skill-lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: edcm/pyproject.toml

      - name: Install builder and test dependencies
        working-directory: edcm
        run: python -m pip install -e . pytest PyYAML build twine

      - name: Reconcile source-count and public-package declarations
        working-directory: edcm
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("edcm/language/source.py")
          text = source.read_text(encoding="utf-8")
          text = text.replace(
              "if len(snapshot.lemmas) != OEWN_EXPECTED_WORD_COUNT:\n"
              "        raise ValueError(\n"
              "            \"OEWN 2025 word count mismatch: \"\n"
              "            f\"expected {OEWN_EXPECTED_WORD_COUNT}, got {len(snapshot.lemmas)}\"\n"
              "        )",
              "if len(snapshot.lexemes) != OEWN_EXPECTED_WORD_COUNT:\n"
              "        raise ValueError(\n"
              "            \"OEWN 2025 lexical-entry count mismatch: \"\n"
              "            f\"expected {OEWN_EXPECTED_WORD_COUNT}, got {len(snapshot.lexemes)}\"\n"
              "        )",
          )
          source.write_text(text, encoding="utf-8")

          package = Path("edcm/__init__.py")
          text = package.read_text(encoding="utf-8")
          if "from . import language" not in text:
              text = text.replace("from . import measurement\n", "from . import measurement\nfrom . import language\n")
          if '    "language",\n' not in text:
              text = text.replace('    "measurement",\n', '    "measurement",\n    "language",\n')
          text = text.replace(
              "measurement, edcmucns, CanonLoader",
              "measurement, language, edcmucns, CanonLoader",
          )
          text = text.replace(
              "edcm_ucns_objects, edcmucns_package",
              "edcm_ucns_objects, edcmucns_package, edcm_language_package",
          )
          text = text.replace(
              "tests.test_packaging\n",
              "tests.test_packaging, tests.test_language_full_run\n",
          )
          package.write_text(text, encoding="utf-8")
          PY

      - name: Run focused contracts before the full build
        working-directory: edcm
        run: pytest tests/test_language_embeddings.py tests/test_language_full_run.py -q

      - name: Verify exact upstream commit
        run: |
          test "$(git -C oewn rev-parse HEAD)" = "dc343f2683279ecbb13fab4e2fd778d7b162d287"
          test "$(git -C oewn rev-list -n 1 2025-edition)" = "dc343f2683279ecbb13fab4e2fd778d7b162d287"

      - name: Build the complete atomic and molecular run
        working-directory: edcm
        run: python tools/build_oewn2025_embeddings.py --source-repo ../oewn --output-root artifacts

      - name: Copy attribution and seal artifact hashes
        working-directory: edcm
        run: python tools/finalize_oewn2025_artifacts.py --source-repo ../oewn --artifact-root artifacts/oewn2025

      - name: Reject unsafe individual artifact size
        working-directory: edcm
        run: |
          oversized=$(find artifacts/oewn2025 -type f -size +95M -print)
          if [ -n "$oversized" ]; then
            echo "Artifacts exceed the 95 MiB repository safety boundary:"
            echo "$oversized"
            exit 1
          fi
          du -sh artifacts/oewn2025
          find artifacts/oewn2025 -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Run the complete repository tests with generated artifacts
        working-directory: edcm
        run: pytest -q

      - name: Build and inspect distributions
        working-directory: edcm
        run: |
          rm -rf dist build
          python -m build
          python -m twine check dist/*

      - name: Regenerate canonical EDCM metadata collection
        run: |
          PYTHONPATH=skill-lib python skill-lib/msdmd/collect.py \
            --root edcm \
            --repo The-Interdependency/edcm \
            --out edcm/edcm_msdmd.ts

      - name: Write final run status
        working-directory: edcm
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          summary = json.loads(Path("artifacts/oewn2025/summary.json").read_text(encoding="utf-8"))
          source = json.loads(Path("artifacts/oewn2025/source-manifest.json").read_text(encoding="utf-8"))
          text = f"""# Open English WordNet 2025 full embedding run

          Status: **complete and generated**

          Source: `globalwordnet/english-wordnet@{source['commit']}` (`2025-edition`)

          - lexical entries: {source['lexical_entry_count']:,}
          - unique dictionary lemmas: {source['unique_lemma_count']:,}
          - materialized dictionary surfaces including forms: {summary['surface_count']:,}
          - root gonols: {summary['root_count']:,}
          - affix gonols: {summary['affix_count']:,}
          - decomposed surfaces: {summary['decomposed_surface_count']:,}
          - ambiguous molecular surfaces: {summary['ambiguous_surface_count']:,}
          - retained molecular alternatives: {summary['molecular_alternative_count']:,}
          - exact direct/generated equivalences: {summary['fork_counts'].get('equivalent', 0):,}
          - direct/generated divergences: {summary['fork_counts'].get('divergent', 0):,}

          Produced artifacts include metadata-bearing source, affix, root,
          morphology, surface-index, and comparison records plus separate
          metadata-free gonol lists for affixes, roots, direct atomic words,
          molecular words, and generated atomic words.

          ## hmmm

          The run is mechanically complete. Empirical interpretation of the
          observed fork distribution and extension into phrase, sentence, and
          paragraph corpora remain research rather than missing construction.
          """
          lines = [line.strip() for line in text.splitlines()]
          Path("docs/oewn2025-full-embedding-run.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Commit generated source fixes, metadata, and artifacts
        working-directory: edcm
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edcm/__init__.py edcm/language/source.py edcm_msdmd.ts docs/oewn2025-full-embedding-run.md artifacts/oewn2025
          git diff --cached --stat
          git commit -m "feat(language): materialize complete OEWN 2025 embedding run"
          git push origin "HEAD:${BRANCH}"
