name: bootstrap EDCM compliance closure

on:
  push:
    branches:
      - agent/edcm-compliance-closure

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/edcm-compliance-closure
          fetch-depth: 0
          path: edcm

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: skill-lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure commit identity
        working-directory: edcm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore canonical meta-module-build skill
        working-directory: edcm
        run: |
          rm -rf .agents/skills/meta-module-build
          cp -a ../skill-lib/meta-module-build .agents/skills/meta-module-build
          git add .agents/skills/meta-module-build
          git commit -m "fix(skills): restore canonical meta-module-build"

      - name: Generate and commit canonical msdmd collection
        working-directory: edcm
        run: |
          PYTHONPATH=../skill-lib python ../skill-lib/msdmd/collect.py \
            --root . \
            --repo The-Interdependency/edcm \
            --out edcm_msdmd.ts
          git add edcm_msdmd.ts
          git commit -m "chore(msdmd): track canonical EDCM collection"

      - name: Reconcile implementation status and remove bootstrap
        working-directory: edcm
        run: |
          cat > codex-handoff/2026-07-12-stack-repair/IMPLEMENTATION_STATUS.md <<'EOF'
          # EDCM stack repair — implementation status

          Updated: 2026-07-12

          This ledger tracks evidence against `REQUIRED_CHANGES.md` and `COMPLETED_LOOKS_LIKE.md`. A checked item means implemented in the current tree with named tests or CI evidence. It does not promote an empirical frontier claim into a validated result.

          ## Completed

          - [x] Authoritative package metadata, version, build system, typed marker, frozen canon package data, development dependencies, Python 3.11–3.13 tests, source/wheel build, `twine check`, clean-wheel installation, and installed public-API smoke — merged in PR #15.
          - [x] EDCM-owned UCNS adapter over actual public surfaces, typed absence, fail-closed schema/object handling, stable-hash preservation, and canonical `edcm.measurement` authority — merged in PR #17.
          - [x] Canonical METAPAT producer schema and actual-UCNS adapter — merged in `The-Interdependency/metapat` PR #3.
          - [x] EDCM-owned METAPAT consumer, semantic-authority preservation, deterministic shared-stack composition, and identity-separated result contract — merged in PR #18.
          - [x] Exact frozen-canon byte manifest, complete file-set gate, measurement-authority policy check, and orthogonality no-fork check from source and installed wheel — merged in PR #19.
          - [x] Canonical versioned UCNS bridge and factorization-evidence producer records — merged in `The-Interdependency/ucns` PR #108.
          - [x] EDCM consumption of live and serialized UCNS bridge/factorization records, stable-hash binding, independent attachment states, negative-certification preservation, and `edcm.shared-stack-result/1.1.0` — merged in PR #20.
          - [x] Repo-local `the-interdependency` and `meta-module-build` skill subset, pinned canonical skill-lib checkout, native metadata validator, and permanent drift/msdmd workflow — merged in PR #21.
          - [x] Vendored `meta-module-build` restored byte-for-byte from pinned `skill-lib@d0036c6c3a449f5a1213e3289dceb1c43263cb52`.
          - [x] Canonical root `edcm_msdmd.ts` generated and tracked for byte-for-byte comparison.
          - [x] Canonical skill drift, msdmd regeneration, native metadata validation, integrity, package tests, source/wheel build, and distribution metadata validation run as the compliance-closure gate.

          ## Repository repair status

          All required stack-repair items are implemented in the current tree. No runtime architecture repair remains open. The package remains `0.1.0` and Alpha; release promotion requires empirical evidence and an explicit release decision rather than additional repository-compliance claims.

          ## Preserved frontier

          Contact convergence, DA geometry correlation, cadence admission from text, and semantic-label-to-operating-state inference remain non-operational. No placeholder values or language-model judgments have been added.

          UCNS theorem, domain, and certification evidence remains separate from EDCM empirical measurement validity. METAPAT semantic authority remains constraints and provenance, not calculated EDCM values. `NA != 0` remains enforced.

          ## hmmm

          Version 1 UCNS evidence digests establish canonical content identity but not cryptographic producer signatures or authenticated transport. The next substantive phase is empirical: fixed corpora, declared falsifiers, repeatable measurements, external comparison, and publication-grade interpretation boundaries.
          EOF
          sed -i 's/^          //' codex-handoff/2026-07-12-stack-repair/IMPLEMENTATION_STATUS.md
          rm .github/workflows/bootstrap-edcm-compliance-closure.yml
          git add codex-handoff/2026-07-12-stack-repair/IMPLEMENTATION_STATUS.md .github/workflows/bootstrap-edcm-compliance-closure.yml
          git commit -m "docs(status): close EDCM compliance repair ledger"

      - name: Validate canonical skill and metadata contracts
        working-directory: edcm
        run: |
          python ../skill-lib/tools/check_consumer_drift.py . \
            --sha d0036c6c3a449f5a1213e3289dceb1c43263cb52 \
            --strict-sha \
            --require-vendored
          PYTHONPATH=../skill-lib python ../skill-lib/msdmd/collect.py \
            --root . \
            --repo The-Interdependency/edcm \
            --out /tmp/edcm_msdmd.ts
          diff -u edcm_msdmd.ts /tmp/edcm_msdmd.ts
          python tools/check_metadata_contracts.py

      - name: Validate package, integrity, tests, and build
        working-directory: edcm
        run: |
          python -m pip install -e ".[dev]"
          python -m edcm.integrity
          python -m pytest -q
          rm -rf dist build
          python -m build
          python -m twine check dist/*

      - name: Push ordered repair commits
        working-directory: edcm
        run: git push origin HEAD:agent/edcm-compliance-closure
