name: materialize UCNS-EDCM v0.4 evidence once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/ucns-edcm-v0-4-discourse-graphs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          ref: agent/ucns-edcm-v0-4-discourse-graphs
          fetch-depth: 0

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: skill-lib

      - name: Check out exact UCNS
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/ucns
          ref: 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed
          path: ucns-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate exact metadata and v0.4 report
        env:
          UCNS_SOURCE_ROOT: ucns-source
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./ucns-source
          python -m pip install -e .[dev]
          python -m pytest -q \
            tests/test_ucns_edcm_experiments.py \
            tests/test_ucns_edcm_experiments_v2.py \
            tests/test_ucns_edcm_experiments_v3.py \
            tests/test_ucns_edcm_experiments_v4.py
          PYTHONPATH=skill-lib python skill-lib/msdmd/collect.py \
            --root . \
            --repo The-Interdependency/edcm \
            --out edcm_msdmd.ts
          python tools/check_metadata_contracts.py
          mkdir -p experiments/results
          python -m edcm.ucns_edcm_experiments_v4 \
            --edcm-commit 4e9b85c942ad42a0e8966112532d9d5222faf126 \
            --ucns-commit 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed \
            --ucns-source-root ucns-source \
            --output experiments/results/2026-07-21-ucns-edcm-v0.4.0.json
          python -m edcm.ucns_edcm_experiments_v4 \
            --edcm-commit 4e9b85c942ad42a0e8966112532d9d5222faf126 \
            --ucns-commit 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed \
            --ucns-source-root ucns-source \
            --output /tmp/ucns-edcm-v0.4-repeat.json
          diff -u experiments/results/2026-07-21-ucns-edcm-v0.4.0.json /tmp/ucns-edcm-v0.4-repeat.json
          rm .github/workflows/materialize-v0.4-evidence-once.yml

      - name: Commit generated evidence and remove materializer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add edcm_msdmd.ts \
            experiments/results/2026-07-21-ucns-edcm-v0.4.0.json \
            .github/workflows/materialize-v0.4-evidence-once.yml
          git commit -m 'data: record UCNS-EDCM v0.4 discourse graph evidence'
          git push origin HEAD:agent/ucns-edcm-v0-4-discourse-graphs