name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: '20 20 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fit JavaScript extraction to the complete checkout
        if: matrix.language == 'javascript-typescript'
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          sizes = [(Path(os.fsdecode(name)).stat().st_size, os.fsdecode(name))
                   for name in tracked if name and Path(os.fsdecode(name)).is_file()]
          largest, name = max(sizes, default=(0, 'empty checkout'))
          megabytes = max(1, (largest + 999_999) // 1_000_000)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CODEQL_EXTRACTOR_JAVASCRIPT_MAX_FILE_SIZE={megabytes}\n')
          print(f'Largest tracked file: {name} ({largest} bytes)')
          print(f'JavaScript extraction allowance: {megabytes} MB, derived from this checkout')
          PY

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze and publish results
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: '/language:${{ matrix.language }}'
