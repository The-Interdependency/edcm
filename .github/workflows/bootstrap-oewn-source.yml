name: bootstrap OEWN source truth

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-oewn-source.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-oewn-source-truth
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: skill-lib

      - name: Reconcile committed source declarations
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("edcm/language/source.py")
          text = source.read_text(encoding="utf-8")
          text = text.replace(
              'value = yaml.safe_load(path.read_text(encoding="utf-8"))',
              'loader = getattr(yaml, "CSafeLoader", yaml.SafeLoader)\n'
              '    value = yaml.load(path.read_text(encoding="utf-8"), Loader=loader)',
          )
          text = text.replace(
              'if len(snapshot.lemmas) != OEWN_EXPECTED_WORD_COUNT:\n'
              '        raise ValueError(\n'
              '            "OEWN 2025 word count mismatch: "\n'
              '            f"expected {OEWN_EXPECTED_WORD_COUNT}, got {len(snapshot.lemmas)}"\n'
              '        )',
              'if len(snapshot.lexemes) != OEWN_EXPECTED_WORD_COUNT:\n'
              '        raise ValueError(\n'
              '            "OEWN 2025 lexical-entry count mismatch: "\n'
              '            f"expected {OEWN_EXPECTED_WORD_COUNT}, got {len(snapshot.lexemes)}"\n'
              '        )',
          )
          source.write_text(text, encoding="utf-8")

          package = Path("edcm/__init__.py")
          text = package.read_text(encoding="utf-8")
          if "from . import language" not in text:
              text = text.replace("from . import measurement\n", "from . import measurement\nfrom . import language\n")
          if '    "language",\n' not in text:
              text = text.replace('    "measurement",\n', '    "measurement",\n    "language",\n')
          text = text.replace(
              "measurement, edcmucns, CanonLoader",
              "measurement, language, edcmucns, CanonLoader",
          )
          text = text.replace(
              "edcm_ucns_objects, edcmucns_package",
              "edcm_ucns_objects, edcmucns_package, edcm_language_package",
          )
          package.write_text(text, encoding="utf-8")
          PY

      - name: Regenerate exact canonical metadata
        run: |
          PYTHONPATH=skill-lib python skill-lib/msdmd/collect.py \
            --root . \
            --repo The-Interdependency/edcm \
            --out edcm_msdmd.ts

      - name: Commit source truth before corpus construction
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edcm/__init__.py edcm/language/source.py edcm_msdmd.ts
          git diff --cached --stat
          git commit -m "fix(language): commit OEWN source truth"
          git push origin "HEAD:${BRANCH}"
