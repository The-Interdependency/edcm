name: rematerialize repaired UCNS-EDCM v0.3 once

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/ucns-edcm-v0-3-scope'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          ref: agent/ucns-edcm-v0-3-scope
          path: edcm
          fetch-depth: 0
      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: skill-lib
      - name: Check out exact UCNS
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/ucns
          ref: 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed
          path: ucns
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate repaired metadata and report
        working-directory: edcm
        run: |
          PYTHONPATH=../skill-lib python ../skill-lib/msdmd/collect.py \
            --root . \
            --repo The-Interdependency/edcm \
            --out edcm_msdmd.ts
          python -m pip install --upgrade pip
          python -m pip install ../ucns
          python -m pip install -e .[dev]
          python tools/check_metadata_contracts.py
          UCNS_SOURCE_ROOT=../ucns python -m pytest -q \
            tests/test_ucns_edcm_experiments.py \
            tests/test_ucns_edcm_experiments_v2.py \
            tests/test_ucns_edcm_experiments_v3.py
          python -m edcm.ucns_edcm_experiments_v3 \
            --edcm-commit 7900d1acc4b0725d55551ec037f9ffce6a5cb026 \
            --ucns-source-root ../ucns \
            --output experiments/results/2026-07-21-ucns-edcm-v0.3.0.json
          python -m edcm.ucns_edcm_experiments_v3 \
            --edcm-commit 7900d1acc4b0725d55551ec037f9ffce6a5cb026 \
            --ucns-source-root ../ucns \
            --output /tmp/ucns-edcm-v0.3.0-repeat.json
          diff -u experiments/results/2026-07-21-ucns-edcm-v0.3.0.json /tmp/ucns-edcm-v0.3.0-repeat.json
          rm .github/workflows/rematerialize-ucns-edcm-v0-3-once.yml
      - name: Commit repaired evidence and remove materializer
        working-directory: edcm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            edcm_msdmd.ts \
            experiments/results/2026-07-21-ucns-edcm-v0.3.0.json \
            .github/workflows/rematerialize-ucns-edcm-v0-3-once.yml
          git commit -m "data: rematerialize repaired UCNS-EDCM v0.3 evidence"
          git push origin HEAD:agent/ucns-edcm-v0-3-scope
