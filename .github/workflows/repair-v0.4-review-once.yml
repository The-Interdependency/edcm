name: repair v0.4 review findings once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/ucns-edcm-v0-4-discourse-graphs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          ref: agent/ucns-edcm-v0-4-discourse-graphs
          fetch-depth: 0

      - name: Check out exact UCNS
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/ucns
          ref: 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed
          path: ucns-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply review repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('edcm/ucns_edcm_experiments_v4.py')
          source = source_path.read_text()

          old_relations = '''        GraphExpectedRelation("ambiguous-repair-divergence", "graph.state_divergence", f"repair-ambiguous::{AMBIGUITY_RESOLVER}", RelationOperator.GT, f"repair-ambiguous::{NEAREST_RESOLVER}", "ambiguous repair must expose divergent graph outcomes"),
        GraphExpectedRelation("local-scope-target-invariant", "edcm.scope.asserted_constraint_events", "explicit-r1", RelationOperator.EQ, "explicit-r2", "local scope event count should remain invariant when only the discourse target changes"),'''
          new_relations = '''        GraphExpectedRelation("ambiguous-repair-divergence", "graph.state_divergence", f"repair-ambiguous::{AMBIGUITY_RESOLVER}", RelationOperator.GT, f"repair-ambiguous::{NEAREST_RESOLVER}", "ambiguous repair must expose divergent graph outcomes"),
        GraphExpectedRelation("ownership-speaker-state", "graph.speaker.A.active_min", f"speaker-ownership::{SAME_SPEAKER_RESOLVER}", RelationOperator.LT, f"speaker-ownership::{NEAREST_RESOLVER}", "speaker-scoped active state must preserve which speaker's requirement remains active"),
        GraphExpectedRelation("nearest-ownership-hypothesis", "graph.gold_hits_min", f"speaker-ownership::{NEAREST_RESOLVER}", RelationOperator.EQ, f"speaker-ownership::{SAME_SPEAKER_RESOLVER}", "nearest-compatible is tested for ownership-sensitive target selection"),
        GraphExpectedRelation("family-wide-specificity-hypothesis", "graph.active_count_min", f"explicit-r1::{FAMILY_WIDE_RESOLVER}", RelationOperator.EQ, f"explicit-r1::{EXPLICIT_RESOLVER}", "family-wide is tested for preserving explicit target specificity without over-retraction"),
        GraphExpectedRelation("explicit-anaphora-hypothesis", "graph.unresolved_count_max", f"anaphora-ambiguous::{EXPLICIT_RESOLVER}", RelationOperator.EQ, f"anaphora-ambiguous::{NEAREST_RESOLVER}", "explicit-only resolution is tested for underspecified anaphora"),
        GraphExpectedRelation("baseline-target-state-hypothesis", "edcm.baseline.kappa_final", "explicit-r1", RelationOperator.NE, "explicit-r2", "the frozen baseline is tested for which-target state sensitivity"),
        GraphExpectedRelation("node-reference-target-state-hypothesis", "ucns.node-reference.W.min", f"explicit-r1::{EXPLICIT_RESOLVER}", RelationOperator.NE, f"explicit-r1::{FAMILY_WIDE_RESOLVER}", "node-reference scalar support is tested for resolver-edge sensitivity"),
        GraphExpectedRelation("node-edge-target-state-control", "ucns.node-edge.W.min", f"explicit-r1::{EXPLICIT_RESOLVER}", RelationOperator.LT, f"explicit-r1::{FAMILY_WIDE_RESOLVER}", "node-edge support should retain the extra family-wide edge"),
        GraphExpectedRelation("local-scope-target-invariant", "edcm.scope.asserted_constraint_events", "explicit-r1", RelationOperator.EQ, "explicit-r2", "local scope event count should remain invariant when only the discourse target changes"),'''
          if old_relations not in source:
              raise SystemExit('relation insertion point not found')
          source = source.replace(old_relations, new_relations)

          old_setup = '''    node_ids = sorted(node.node_id for node in case.nodes)
    per_node: dict[str, list[float]] = {node_id: [] for node_id in node_ids}
    per_node_retracted: dict[str, list[float]] = {node_id: [] for node_id in node_ids}
    contradiction_counts = []'''
          new_setup = '''    node_ids = sorted(node.node_id for node in case.nodes)
    speaker_by_node = {node.node_id: node.speaker for node in case.nodes}
    speaker_ids = sorted(set(speaker_by_node.values()))
    per_node: dict[str, list[float]] = {node_id: [] for node_id in node_ids}
    per_node_retracted: dict[str, list[float]] = {node_id: [] for node_id in node_ids}
    per_speaker_active: dict[str, list[float]] = {speaker: [] for speaker in speaker_ids}
    contradiction_counts = []'''
          if old_setup not in source:
              raise SystemExit('resolution setup not found')
          source = source.replace(old_setup, new_setup)

          old_node_loop = '''        for node_id in node_ids:
            per_node[node_id].append(1.0 if states[node_id].state == _STATE_ACTIVE else 0.0)
            per_node_retracted[node_id].append(1.0 if states[node_id].state == _STATE_RETRACTED else 0.0)'''
          new_node_loop = '''        for node_id in node_ids:
            per_node[node_id].append(1.0 if states[node_id].state == _STATE_ACTIVE else 0.0)
            per_node_retracted[node_id].append(1.0 if states[node_id].state == _STATE_RETRACTED else 0.0)
        for speaker in speaker_ids:
            per_speaker_active[speaker].append(
                float(sum(states[node_id].state == _STATE_ACTIVE for node_id in node_ids if speaker_by_node[node_id] == speaker))
            )'''
          if old_node_loop not in source:
              raise SystemExit('node loop not found')
          source = source.replace(old_node_loop, new_node_loop)

          old_value_tail = '''    for node_id in node_ids:
        values.append((f"graph.node.{node_id}.active", float(min(per_node[node_id]))))
        values.append((f"graph.node.{node_id}.retracted", float(max(per_node_retracted[node_id]))))
    return tuple(values)'''
          new_value_tail = '''    for node_id in node_ids:
        values.append((f"graph.node.{node_id}.active", float(min(per_node[node_id]))))
        values.append((f"graph.node.{node_id}.retracted", float(max(per_node_retracted[node_id]))))
    for speaker in speaker_ids:
        values.append((f"graph.speaker.{speaker}.active_min", float(min(per_speaker_active[speaker]))))
        values.append((f"graph.speaker.{speaker}.active_max", float(max(per_speaker_active[speaker]))))
    return tuple(values)'''
          if old_value_tail not in source:
              raise SystemExit('value tail not found')
          source = source.replace(old_value_tail, new_value_tail)

          old_graph_header = '''    nodes = sorted(case.nodes, key=lambda node: (node.turn_index, node.node_id))
    edges = sorted(interpretation.edges, key=lambda edge: (edge.source_turn, edge.reference_id, edge.target_node_id, edge.relation))
    states = _state_map(interpretation)'''
          new_graph_header = '''    nodes = sorted(case.nodes, key=lambda node: (node.turn_index, node.node_id))
    edges = sorted(interpretation.edges, key=lambda edge: (edge.source_turn, edge.reference_id, edge.target_node_id, edge.relation))
    quote_edges = sorted((node.quoted_parent, node.node_id, "quotes") for node in nodes if node.quoted_parent is not None)
    states = _state_map(interpretation)'''
          if old_graph_header not in source:
              raise SystemExit('graph header not found')
          source = source.replace(old_graph_header, new_graph_header)

          source = source.replace(
              '"nodes": [(node.node_id, node.turn_index, node.speaker, node.family, node.label, node.group, node.initial_state) for node in nodes],',
              '"nodes": [(node.node_id, node.turn_index, node.speaker, node.family, node.label, node.group, node.quoted_parent, node.initial_state) for node in nodes],',
          )
          source = source.replace(
              '"edges": [(edge.reference_id, edge.target_node_id, edge.relation) for edge in edges],',
              '"edges": [(edge.reference_id, edge.target_node_id, edge.relation) for edge in edges] + quote_edges,',
              1,
          )
          source = source.replace(
              '"nodes": sorted((node.node_id, node.speaker, node.family, node.label, node.group, node.initial_state) for node in nodes),',
              '"nodes": sorted((node.node_id, node.speaker, node.family, node.label, node.group, node.quoted_parent, node.initial_state) for node in nodes),',
          )
          source = source.replace(
              '"edges": sorted((edge.reference_id, edge.target_node_id, edge.relation) for edge in edges),',
              '"edges": sorted([(edge.reference_id, edge.target_node_id, edge.relation) for edge in edges] + quote_edges),',
          )
          source = source.replace(
              '"edges": sorted((edge.reference_id, edge.target_node_id) for edge in edges),',
              '"edges": sorted([(edge.reference_id, edge.target_node_id) for edge in edges] + [(parent, child) for parent, child, _ in quote_edges]),',
          )

          old_builder = '''    cells = []
    for node in sorted(case.nodes, key=lambda item: (item.turn_index, item.node_id)):
        if support_policy == "node-only":
            mu = 1.0
        elif support_policy == "node-edge":
            mu = 1.0
        elif support_policy == "state-detail":
            state = states[node.node_id]
            mu = 1.0 + (1.0 if state.state == _STATE_ACTIVE else 0.0) + float(state.contradictions > 0)
        else:
            raise KeyError(support_policy)
        cells.append(Cell(coordinate=("node", node.node_id), payload=asdict(node), type_tag="discourse-node", state=(states[node.node_id].state,), provenance=(case.source.case_id, interpretation.interpretation_id), relation=None, mu=mu))
    if support_policy in {"node-edge", "state-detail"}:
        for edge in interpretation.edges:
            cells.append(Cell(coordinate=("edge", edge.edge_id), payload=asdict(edge), type_tag="discourse-edge", state=(edge.relation,), provenance=(case.source.case_id, interpretation.interpretation_id), relation=(edge.reference_id, edge.target_node_id), mu=1.0))'''
          new_builder = '''    cells = []
    for node in sorted(case.nodes, key=lambda item: (item.turn_index, item.node_id)):
        if support_policy in {"node-reference", "node-edge"}:
            mu = 1.0
        elif support_policy == "state-detail":
            state = states[node.node_id]
            mu = 1.0 + (1.0 if state.state == _STATE_ACTIVE else 0.0) + float(state.contradictions > 0)
        else:
            raise KeyError(support_policy)
        cells.append(Cell(coordinate=("node", node.node_id), payload=asdict(node), type_tag="discourse-node", state=(states[node.node_id].state,), provenance=(case.source.case_id, interpretation.interpretation_id), relation=None, mu=mu))
    unresolved = set(interpretation.unresolved_references)
    for reference in sorted(case.references, key=lambda item: (item.turn_index, item.reference_id)):
        reference_state = "unresolved" if reference.reference_id in unresolved else "resolved"
        reference_mu = 1.0 + (1.0 if support_policy == "state-detail" and reference_state == "unresolved" else 0.0)
        cells.append(Cell(coordinate=("reference", reference.reference_id), payload=asdict(reference), type_tag="discourse-reference", state=(reference_state,), provenance=(case.source.case_id, interpretation.interpretation_id), relation=None, mu=reference_mu))
    if support_policy in {"node-edge", "state-detail"}:
        for edge in interpretation.edges:
            cells.append(Cell(coordinate=("edge", edge.edge_id), payload=asdict(edge), type_tag="discourse-edge", state=(edge.relation,), provenance=(case.source.case_id, interpretation.interpretation_id), relation=(edge.reference_id, edge.target_node_id), mu=1.0))
        for node in case.nodes:
            if node.quoted_parent is not None:
                payload = {"source": node.quoted_parent, "target": node.node_id, "relation": "quotes"}
                cells.append(Cell(coordinate=("quote-edge", node.quoted_parent, node.node_id), payload=payload, type_tag="discourse-edge", state=("quotes",), provenance=(case.source.case_id, interpretation.interpretation_id), relation=(node.quoted_parent, node.node_id), mu=1.0))'''
          if old_builder not in source:
              raise SystemExit('carrier builder not found')
          source = source.replace(old_builder, new_builder)
          source = source.replace('for support in ("node-only", "node-edge", "state-detail"):', 'for support in ("node-reference", "node-edge", "state-detail"):')

          old_signatures = '''def _signatures(case: GraphCase, resolution: GraphResolution, ucns_api: Mapping[str, Any]) -> tuple[GraphSignatureRecord, ...]:
    records = []
    views = ("exact-ordered-labeled", "labeled-multigraph", "unlabeled-multigraph", "flat-node-multiset", "active-state-summary")
    for interpretation in resolution.interpretations:
        for support in ("node-reference", "node-edge", "state-detail"):
            for view_name in views:
                view, losses = _graph_view(case, interpretation, view_name)
                records.append(GraphSignatureRecord(f"{case.source.case_id}::{resolution.resolver_id}", interpretation.interpretation_id, support, view_name, _digest(view), tuple(sorted(losses))))
    return tuple(records)'''
          new_signatures = '''def _signatures(case: GraphCase, resolution: GraphResolution, ucns_api: Mapping[str, Any]) -> tuple[GraphSignatureRecord, ...]:
    records = []
    resolution_id = f"{case.source.case_id}::{resolution.resolver_id}"
    views = ("exact-ordered-labeled", "labeled-multigraph", "unlabeled-multigraph", "flat-node-multiset", "active-state-summary")
    bundle_parts: dict[tuple[str, str], list[tuple[str, str]]] = {}
    bundle_losses: dict[tuple[str, str], set[str]] = {}
    for interpretation in resolution.interpretations:
        for support in ("node-reference", "node-edge", "state-detail"):
            for view_name in views:
                view, losses = _graph_view(case, interpretation, view_name)
                signature = _digest(view)
                records.append(GraphSignatureRecord(resolution_id, interpretation.interpretation_id, support, view_name, signature, tuple(sorted(losses))))
                key = (support, view_name)
                bundle_parts.setdefault(key, []).append((interpretation.interpretation_id, signature))
                bundle_losses.setdefault(key, set()).update(losses)
    for (support, view_name), parts in sorted(bundle_parts.items()):
        records.append(
            GraphSignatureRecord(
                resolution_id,
                "__bundle__",
                support,
                view_name,
                _digest(tuple(sorted(parts))),
                tuple(sorted(bundle_losses[(support, view_name)])),
            )
        )
    return tuple(records)'''
          if old_signatures not in source:
              raise SystemExit('signature function not found')
          source = source.replace(old_signatures, new_signatures)

          source = source.replace(
              '        left_resolution = resolutions[left_id]\n        right_resolution = resolutions[right_id]\n        left_interpretation = left_resolution.interpretations[0]\n        right_interpretation = right_resolution.interpretations[0]\n        for view_name in ("exact-ordered-labeled", "labeled-multigraph", "unlabeled-multigraph", "flat-node-multiset", "active-state-summary"):\n            left_record = signature_index[(left_id, left_interpretation.interpretation_id, view_name)]\n            right_record = signature_index[(right_id, right_interpretation.interpretation_id, view_name)]',
              '        for view_name in ("exact-ordered-labeled", "labeled-multigraph", "unlabeled-multigraph", "flat-node-multiset", "active-state-summary"):\n            left_record = signature_index[(left_id, "__bundle__", view_name)]\n            right_record = signature_index[(right_id, "__bundle__", view_name)]',
          )

          source_path.write_text(source)

          test_path = Path('tests/test_ucns_edcm_experiments_v4.py')
          tests = test_path.read_text()
          tests = tests.replace('assert len(relations) == 12', 'assert len(relations) == 19')
          tests = tests.replace(
              '        "ambiguous-repair-divergence",\n    ):',
              '        "ambiguous-repair-divergence",\n        "ownership-speaker-state",\n        "node-edge-target-state-control",\n    ):',
          )
          marker = '''    unresolved_resolution = next(
'''
          addition = '''    for relation_id in (
        "nearest-ownership-hypothesis",
        "family-wide-specificity-hypothesis",
        "explicit-anaphora-hypothesis",
        "baseline-target-state-hypothesis",
        "node-reference-target-state-hypothesis",
    ):
        assert verdicts[relation_id] == "falsified"

    def readout(case_id, name):
        for row in report.readouts:
            if row.case_id == case_id and row.error is None:
                try:
                    return row.value(name)
                except KeyError:
                    pass
        raise AssertionError((case_id, name))

    assert readout("anaphora-ambiguous::explicit-reference-v1", "ucns.node-reference.W.min") == readout(
        "anaphora-ambiguous::nearest-compatible-v1", "ucns.node-reference.W.min"
    )
    assert readout("speaker-ownership::same-speaker-nearest-v1", "graph.speaker.A.active_min") == 0.0
    assert readout("speaker-ownership::nearest-compatible-v1", "graph.speaker.A.active_min") == 1.0

    ambiguity_bundle = next(
        item for item in report.structural_signatures
        if item.resolution_id == "repair-ambiguous::ambiguity-preserving-v1"
        and item.interpretation_id == "__bundle__"
        and item.support_policy == "node-edge"
        and item.view_name == "exact-ordered-labeled"
    )
    nearest_bundle = next(
        item for item in report.structural_signatures
        if item.resolution_id == "repair-ambiguous::nearest-compatible-v1"
        and item.interpretation_id == "__bundle__"
        and item.support_policy == "node-edge"
        and item.view_name == "exact-ordered-labeled"
    )
    assert ambiguity_bundle.signature != nearest_bundle.signature

'''
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          tests = tests.replace(marker, addition + marker)

          import_line = 'import pytest\n'
          if 'from dataclasses import replace\n' not in tests:
              tests = tests.replace(import_line, 'from dataclasses import replace\n\n' + import_line)
          tests = tests.replace(
              '    run_v4_experiments,\n)',
              '    run_v4_experiments,\n    _graph_view,\n)',
          )
          quote_assertion = '''    nested_explicit = _states(resolve_case(_case("nested-quotation"), EXPLICIT_RESOLVER))
'''
          quote_test = '''    nested_case = _case("nested-quotation")
    nested_resolution = resolve_case(nested_case, EXPLICIT_RESOLVER)
    nested_view, _ = _graph_view(nested_case, nested_resolution.interpretations[0], "exact-ordered-labeled")
    stripped_case = replace(
        nested_case,
        nodes=tuple(replace(node, quoted_parent=None) for node in nested_case.nodes),
    )
    stripped_view, _ = _graph_view(stripped_case, nested_resolution.interpretations[0], "exact-ordered-labeled")
    assert nested_view != stripped_view

'''
          if quote_assertion not in tests:
              raise SystemExit('quote assertion marker not found')
          tests = tests.replace(quote_assertion, quote_test + quote_assertion)
          test_path.write_text(tests)

          design_path = Path('docs/experiments/2026-07-21-ucns-edcm-v0.4-design.md')
          design = design_path.read_text().replace('`node-only` — counts event nodes while retaining edges outside the cell sum;', '`node-reference` — counts event nodes and every reference expression while retaining selected edges outside the cell sum;')
          design_path.write_text(design)
          PY
          rm -f experiments/results/2026-07-21-ucns-edcm-v0.4.0.json
          rm .github/workflows/repair-v0.4-review-once.yml

      - name: Install and validate repaired graph evidence
        env:
          UCNS_SOURCE_ROOT: ucns-source
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./ucns-source
          python -m pip install -e .[dev]
          python tools/check_metadata_contracts.py
          python -m pytest -q \
            tests/test_ucns_edcm_experiments.py \
            tests/test_ucns_edcm_experiments_v2.py \
            tests/test_ucns_edcm_experiments_v3.py \
            tests/test_ucns_edcm_experiments_v4.py
          python -m edcm.ucns_edcm_experiments_v4 \
            --edcm-commit review-repair \
            --ucns-source-root ucns-source \
            --output /tmp/v0.4.json
          python -m edcm.ucns_edcm_experiments_v4 \
            --edcm-commit review-repair \
            --ucns-source-root ucns-source \
            --output /tmp/v0.4-repeat.json
          diff -u /tmp/v0.4.json /tmp/v0.4-repeat.json

      - name: Commit repair and remove stale evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add edcm/ucns_edcm_experiments_v4.py \
            tests/test_ucns_edcm_experiments_v4.py \
            docs/experiments/2026-07-21-ucns-edcm-v0.4-design.md \
            experiments/results/2026-07-21-ucns-edcm-v0.4.0.json \
            .github/workflows/repair-v0.4-review-once.yml
          git commit -m 'fix: preserve complete v0.4 graph evidence'
          git push origin HEAD:agent/ucns-edcm-v0-4-discourse-graphs
