name: bootstrap language metadata collection

on:
  push:
    branches: [agent/atomic-molecular-vernacular]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: .canonical-skill-lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate canonical collection and run focused contracts
        run: |
          PYTHONPATH=.canonical-skill-lib python .canonical-skill-lib/msdmd/collect.py \
            --root . \
            --repo The-Interdependency/edcm \
            --out edcm_msdmd.ts
          python -m pip install -e . pytest
          pytest -q tests/test_language_embeddings.py
          python tools/check_metadata_contracts.py

      - name: Commit canonical collection and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edcm_msdmd.ts
          git rm .github/workflows/bootstrap-language-msdmd.yml
          git commit -m "chore(msdmd): collect language embedding modules"
          git push origin HEAD:agent/atomic-molecular-vernacular
