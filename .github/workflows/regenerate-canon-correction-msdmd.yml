name: regenerate canon-correction metadata

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/regenerate-canon-correction-msdmd.yml"

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: .tmp-skill-lib

      - name: Regenerate exact collection
        run: |
          PYTHONPATH=.tmp-skill-lib python .tmp-skill-lib/msdmd/collect.py \
            --root . \
            --repo The-Interdependency/edcm \
            --out edcm_msdmd.ts
          rm -rf .tmp-skill-lib

      - name: Commit generated metadata
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- edcm_msdmd.ts; then
            echo "collection already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edcm_msdmd.ts
          git commit -m "build(metadata): regenerate canon-correction collection"
          git push origin "HEAD:${TARGET_BRANCH}"
