name: repair UCNS-EDCM v0.3 event provenance once

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/ucns-edcm-v0-3-scope'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          ref: agent/ucns-edcm-v0-3-scope
          path: edcm
          fetch-depth: 0
      - name: Check out exact UCNS
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/ucns
          ref: 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed
          path: ucns
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repair speaker and event-order provenance
        working-directory: edcm
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('edcm/ucns_edcm_experiments_v3.py')
          text = path.read_text()
          replacements = {
              'from dataclasses import asdict, dataclass': 'from dataclasses import asdict, dataclass, replace',
              '#   internal_surface: _quote_spans, _mention_events, _repair_events, _extract_scope_events, _build_scope_envelope, _scope_signatures, _pair_findings': '#   internal_surface: _split_scope_turns, _quote_spans, _mention_events, _repair_events, _extract_scope_events, _build_scope_envelope, _scope_signatures, _pair_findings',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected source fragment: {old}')
              text = text.replace(old, new)

          marker = '''def _quote_spans(text: str) -> tuple[tuple[int, int], ...]:\n'''
          helper = '''_SCOPE_TURN_RE = re.compile(\n    r"^(?P<speaker>[A-Za-z][A-Za-z0-9 _\\-]{0,30})\\s*:\\s*(?P<text>.+)$"\n)\n\n\ndef _split_scope_turns(text: str) -> tuple[tuple[str, str], ...]:\n    """Preserve explicit speaker labels even for a one-turn transcript."""\n\n    labelled: list[tuple[str, str]] = []\n    for raw_line in text.splitlines():\n        line = raw_line.strip()\n        if not line:\n            continue\n        match = _SCOPE_TURN_RE.match(line)\n        if match is None:\n            return tuple(_split_turns(text))\n        labelled.append((match.group("speaker").strip(), match.group("text").strip()))\n    return tuple(labelled) if labelled else tuple(_split_turns(text))\n\n\n'''
          if marker not in text:
              raise SystemExit('quote-span insertion point not found')
          text = text.replace(marker, helper + marker, 1)

          old_extract = '''def _extract_scope_events(case: ExperimentCase) -> tuple[ScopeEvent, ...]:\n    events: list[ScopeEvent] = []\n    for turn_index, (speaker, text) in enumerate(_split_turns(case.transcript)):\n        mentions = _mention_events(case, turn_index, speaker, text)\n        repairs = _repair_events(case, turn_index, speaker, text, len(mentions))\n        turn_events = sorted(mentions + repairs, key=lambda event: (event.span_start, event.event_index))\n        events.extend(turn_events)\n    return tuple(events)\n'''
          new_extract = '''def _extract_scope_events(case: ExperimentCase) -> tuple[ScopeEvent, ...]:\n    events: list[ScopeEvent] = []\n    for turn_index, (speaker, text) in enumerate(_split_scope_turns(case.transcript)):\n        mentions = _mention_events(case, turn_index, speaker, text)\n        repairs = _repair_events(case, turn_index, speaker, text, len(mentions))\n        discovered = sorted(\n            mentions + repairs,\n            key=lambda event: (event.span_start, event.event_index),\n        )\n        turn_events = tuple(\n            replace(\n                event,\n                event_id=(\n                    f"{case.case_id}:t{turn_index}:e{source_index}:"\n                    f"{event.kind}:{event.family}"\n                ),\n                event_index=source_index,\n            )\n            for source_index, event in enumerate(discovered, start=1)\n        )\n        events.extend(turn_events)\n    return tuple(events)\n'''
          if old_extract not in text:
              raise SystemExit('scope extraction function not found')
          path.write_text(text.replace(old_extract, new_extract))

          test_path = Path('tests/test_ucns_edcm_experiments_v3.py')
          tests = test_path.read_text()
          tests = tests.replace(
              '    scope_assertion_readout,\n',
              '    _extract_scope_events,\n    scope_assertion_readout,\n',
          )
          insertion = '''\n\ndef test_scope_event_provenance_preserves_speaker_and_source_order() -> None:\n    single = _extract_scope_events(_case("refusal-owned"))\n    assert len(single) == 1\n    assert single[0].speaker == "B"\n    assert single[0].event_index == 1\n    assert ":e1:" in single[0].event_id\n\n    conditional = _extract_scope_events(_case("revocation-operative"))\n    assert tuple(event.phrase for event in conditional) == (\n        "refuse",\n        "access will be revoked",\n    )\n    assert tuple(event.event_index for event in conditional) == (1, 2)\n    assert tuple(":e1:" in conditional[0].event_id for _ in (0,)) == (True,)\n    assert ":e2:" in conditional[1].event_id\n'''
          anchor = '\n\ndef test_v3_joint_report_preserves_scope_and_no_canon(tmp_path) -> None:\n'
          if anchor not in tests:
              raise SystemExit('test insertion point not found')
          tests = tests.replace(anchor, insertion + anchor, 1)
          test_path.write_text(tests)
          PY
          rm .github/workflows/fix-v0-3-event-provenance-once.yml
          python -m py_compile edcm/ucns_edcm_experiments_v3.py tests/test_ucns_edcm_experiments_v3.py
      - name: Install and run scope witnesses
        run: |
          python -m pip install ./ucns
          python -m pip install -e ./edcm[dev]
          cd edcm
          UCNS_SOURCE_ROOT=../ucns python -m pytest -q tests/test_ucns_edcm_experiments_v3.py
      - name: Commit repair and remove workflow
        working-directory: edcm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            edcm/ucns_edcm_experiments_v3.py \
            tests/test_ucns_edcm_experiments_v3.py \
            .github/workflows/fix-v0-3-event-provenance-once.yml
          git commit -m "fix: preserve v0.3 speaker and event order provenance"
          git push origin HEAD:agent/ucns-edcm-v0-3-scope
