name: diagnose repaired v0.4 evidence

on:
  push:
    branches: [agent/ucns-edcm-v0-4-discourse-graphs]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ucns-edcm-v0-4-discourse-graphs
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: The-Interdependency/ucns
          ref: 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed
          path: ucns-source

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply repaired tree locally
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/repair-v0.4-review-once.yml')
          lines = workflow.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script_lines = []
          inside_triple = False
          for line in lines[start:end]:
              rendered = line if inside_triple else (line[10:] if line.startswith('          ') else line)
              script_lines.append(rendered)
              if line.count("'''") % 2 == 1:
                  inside_triple = not inside_triple
          exec(compile('\n'.join(script_lines), str(workflow), 'exec'))
          PY
          rm -f experiments/results/2026-07-21-ucns-edcm-v0.4.0.json

      - name: Capture repaired validation
        env:
          UCNS_SOURCE_ROOT: ucns-source
        run: |
          set +e
          {
            python -m pip install --upgrade pip
            echo "pip_upgrade=$?"
            python -m pip install ./ucns-source
            echo "ucns_install=$?"
            python -m pip install -e .[dev]
            echo "edcm_install=$?"
            python tools/check_metadata_contracts.py
            echo "metadata=$?"
            python -m pytest -q \
              tests/test_ucns_edcm_experiments.py \
              tests/test_ucns_edcm_experiments_v2.py \
              tests/test_ucns_edcm_experiments_v3.py \
              tests/test_ucns_edcm_experiments_v4.py
            echo "pytest=$?"
            python -m edcm.ucns_edcm_experiments_v4 \
              --edcm-commit review-repair \
              --ucns-source-root ucns-source \
              --output /tmp/v0.4.json
            echo "report_first=$?"
            python -m edcm.ucns_edcm_experiments_v4 \
              --edcm-commit review-repair \
              --ucns-source-root ucns-source \
              --output /tmp/v0.4-repeat.json
            echo "report_repeat=$?"
            diff -u /tmp/v0.4.json /tmp/v0.4-repeat.json
            echo "diff=$?"
          } > /tmp/v0.4-repaired-validation.txt 2>&1

      - name: Commit diagnostic only
        run: |
          cp /tmp/v0.4-repaired-validation.txt docs/experiments/v0.4-repair-validation-diagnostic.txt
          git restore edcm/ucns_edcm_experiments_v4.py tests/test_ucns_edcm_experiments_v4.py || true
          git restore experiments/results/2026-07-21-ucns-edcm-v0.4.0.json || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/experiments/v0.4-repair-validation-diagnostic.txt
          git commit -m 'diagnostic: record repaired v0.4 validation'
          git push origin HEAD:agent/ucns-edcm-v0-4-discourse-graphs
