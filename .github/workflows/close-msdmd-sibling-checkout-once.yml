name: close metadata collection with sibling skill checkout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  close:
    if: github.head_ref == 'agent/ucns-edcm-v0-4-discourse-graphs'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          ref: agent/ucns-edcm-v0-4-discourse-graphs
          path: edcm
          fetch-depth: 0

      - name: Check out pinned canonical skill-lib as sibling
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: skill-lib

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove temporary workflows before collection
        run: |
          rm -f edcm/.github/workflows/close-msdmd-sibling-checkout-once.yml
          rm -f edcm/.github/workflows/diagnose-msdmd-fixed-point-once.yml

      - name: Generate exact EDCM-only collection
        working-directory: edcm
        run: |
          PYTHONPATH=../skill-lib python ../skill-lib/msdmd/collect.py \
            --root . \
            --repo The-Interdependency/edcm \
            --out edcm_msdmd.ts
          python tools/check_metadata_contracts.py

      - name: Commit exact collection and temporary workflow removals
        working-directory: edcm
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add edcm_msdmd.ts \
            .github/workflows/close-msdmd-sibling-checkout-once.yml \
            .github/workflows/diagnose-msdmd-fixed-point-once.yml
          git commit -m 'meta: close EDCM-only metadata collection'
          git push origin HEAD:agent/ucns-edcm-v0-4-discourse-graphs
