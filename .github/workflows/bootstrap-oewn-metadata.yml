name: bootstrap OEWN clean-root metadata

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-oewn-metadata.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-oewn-clean-root-metadata
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          path: edcm
          fetch-depth: 0

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: skill-lib

      - name: Generate clean-root metadata collection
        run: |
          PYTHONPATH=skill-lib python skill-lib/msdmd/collect.py \
            --root edcm \
            --repo The-Interdependency/edcm \
            --out edcm/edcm_msdmd.ts

      - name: Commit canonical collection
        working-directory: edcm
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edcm_msdmd.ts
          git diff --cached --stat
          git commit -m "build(metadata): regenerate clean-root collection"
          git push origin "HEAD:${BRANCH}"
