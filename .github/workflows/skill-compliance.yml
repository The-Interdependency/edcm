name: skill and metadata compliance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-drift:
    name: Canonical skill-lib drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM
        uses: actions/checkout@v7.0.1
        with:
          path: edcm

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/skill-lib
          ref: 38c64332b840b2bbe1c07e53aeee8996644548e9
          path: skill-lib

      - name: Check vendored subset byte-for-byte
        working-directory: skill-lib
        run: |
          python tools/check_consumer_drift.py ../edcm \
            --canon-root . \
            --sha 38c64332b840b2bbe1c07e53aeee8996644548e9 \
            --strict-sha \
            --require-vendored

  msdmd:
    name: Canonical msdmd collection and native metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM
        uses: actions/checkout@v7.0.1
        with:
          path: edcm

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/skill-lib
          ref: 38c64332b840b2bbe1c07e53aeee8996644548e9
          path: skill-lib

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"

      - name: Install msdmd native reader runtimes
        run: |
          python -m pip install -r skill-lib/msdmd/requirements.txt
          npm ci --ignore-scripts --prefix skill-lib/msdmd

      - name: Generate canonical msdmd collection
        # Exit 3 (missing runtime), 4 (stale helper) and 5 (git visibility) fail
        # this step; --snapshot-identity binds the output to source bytes rather
        # than the CI merge commit.
        run: |
          PYTHONPATH=skill-lib python skill-lib/msdmd/collect.py \
            --root edcm \
            --repo The-Interdependency/edcm \
            --snapshot-identity \
            --out /tmp/edcm_msdmd.ts

      - name: Validate EDCM-native metadata contracts
        working-directory: edcm
        run: python tools/check_metadata_contracts.py

      - name: Compare tracked collection point
        run: |
          test -f edcm/edcm_msdmd.ts
          diff -u edcm/edcm_msdmd.ts /tmp/edcm_msdmd.ts

      - name: Upload generated collection for diagnosis
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: edcm-msdmd-collection
          path: /tmp/edcm_msdmd.ts
          if-no-files-found: warn
