name: skill and metadata compliance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-drift:
    name: Canonical skill-lib drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM
        uses: actions/checkout@v7.0.1
        with:
          path: edcm

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/skill-lib
          ref: a1c6a7124af537ee9937b6fc6084940091982fe5
          path: skill-lib

      - name: Check vendored subset byte-for-byte
        working-directory: skill-lib
        run: |
          python tools/check_consumer_drift.py ../edcm \
            --canon-root . \
            --sha a1c6a7124af537ee9937b6fc6084940091982fe5 \
            --strict-sha \
            --require-vendored

  msdmd:
    name: Canonical msdmd collection and native metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM
        uses: actions/checkout@v7.0.1
        with:
          path: edcm

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/skill-lib
          ref: a1c6a7124af537ee9937b6fc6084940091982fe5
          path: skill-lib

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Generate canonical msdmd collection
        run: |
          PYTHONPATH=skill-lib python skill-lib/msdmd/collect.py \
            --root edcm \
            --repo The-Interdependency/edcm \
            --out /tmp/edcm_msdmd.ts

      - name: Validate EDCM-native metadata contracts
        working-directory: edcm
        run: python tools/check_metadata_contracts.py

      - name: Compare tracked collection point
        run: |
          test -f edcm/edcm_msdmd.ts
          diff -u edcm/edcm_msdmd.ts /tmp/edcm_msdmd.ts

      - name: Upload generated collection for diagnosis
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: edcm-msdmd-collection
          path: /tmp/edcm_msdmd.ts
          if-no-files-found: warn
