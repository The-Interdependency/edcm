name: UCNS fork authorization lint

on:
  pull_request:
    paths:
      - "edcm/ucns_fork_lint.py"
      - "tests/test_ucns_fork_lint.py"
      - "docs/ucns-fork-lint.md"
      - "docs/ucns-adapter.md"
      - "pyproject.toml"
      - ".github/workflows/ucns-fork-lint.yml"
  push:
    branches: [main]
    paths:
      - "edcm/ucns_fork_lint.py"
      - "tests/test_ucns_fork_lint.py"
      - "docs/ucns-fork-lint.md"
      - "docs/ucns-adapter.md"
      - "pyproject.toml"
      - ".github/workflows/ucns-fork-lint.yml"

permissions:
  contents: read

jobs:
  actual-full-stack:
    name: Historical fork lint / current UCNS profile boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install maintained stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,full-stack]"

      - name: Run fork-lint contracts
        run: python -m pytest -q tests/test_ucns_fork_lint.py

      - name: Prove the current profile does not revive retired fork geometry
        run: |
          python - <<'PY'
          import edcm
          import metapat
          import ucns

          assert ucns.EDCM_PROFILE_ID == "ucns.profile.edcm-word-gonol"

          envelope = metapat.root_spine_module_envelope()
          result = edcm.build_default_layers().run({
              "transcript": "A: Preserve the reset boundary.",
              "metapat_envelope": envelope,
              "ucns_turns": (("A", "Preserve the reset boundary."),),
          })

          status = result["ucns_integration"]
          assert status["ucns_package_available"] is True
          assert status["ucns_adapter_active"] is True
          assert status["ucns_profile_observation_attached"] is True
          assert status["ucns_object_attached"] is False
          assert status["ucns_bridge_record_attached"] is False
          assert status["ucns_scope_metadata_attached"] is True
          assert status["ucns_factorization_evidence_attached"] is False
          assert status["ucns_negative_certification_attached"] is False
          assert status["ucns_theorem_status_attached"] is False

          contract = result["edcm_result"]
          assert contract["ucns_profile_observation"]["state"] == "attached"
          assert contract["ucns_geometry_identity"]["state"] == "NA"
          assert contract["ucns_factorization_evidence"]["state"] == "NA"
          assert contract["status_evidence"]["proof_status_transfers_to_measurement_validity"] is False
          PY
