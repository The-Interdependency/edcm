name: address PR 36 review once

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/ucns-edcm-experiment-first'
    runs-on: ubuntu-latest
    steps:
      - name: Check out EDCM branch
        uses: actions/checkout@v4
        with:
          ref: agent/ucns-edcm-experiment-first
          fetch-depth: 0
          path: edcm

      - name: Check out pinned canonical skill-lib
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/skill-lib
          ref: d0036c6c3a449f5a1213e3289dceb1c43263cb52
          path: skill-lib

      - name: Check out exact UCNS experiment authority
        uses: actions/checkout@v4
        with:
          repository: The-Interdependency/ucns
          ref: 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed
          path: ucns

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply fail-closed identity and report-schema fixes
        working-directory: edcm
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("edcm/ucns_edcm_experiments.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              "Run with the exact UCNS commit declared by :data:`EXPECTED_UCNS_COMMIT` installed:\n\n    python -m edcm.ucns_edcm_experiments \\\n        --output artifacts/ucns-edcm-report.json",
              "Run with the exact UCNS commit declared by :data:`EXPECTED_UCNS_COMMIT` installed from a matching checkout:\n\n    python -m edcm.ucns_edcm_experiments \\\n        --ucns-source-root /path/to/ucns-checkout \\\n        --output artifacts/ucns-edcm-report.json",
          )
          replace_once(
              "#   public_surface: ExperimentPartition, RelationOperator, ExperimentCase, ExpectedRelation, CandidateReadout, RelationVerdict, PolicyPreservationFinding, ExperimentReport, build_default_program, contrastive_readout, baseline_readout, run_default_experiments, main",
              "#   public_surface: ExperimentPartition, RelationOperator, ExperimentCase, ExpectedRelation, CandidateReadout, RelationVerdict, PolicyPreservationFinding, StructuralSignatureRecord, ExperimentReport, build_default_program, contrastive_readout, baseline_readout, run_default_experiments, main",
          )
          replace_once(
              "#   internal_surface: _load_ucns, _split_turns, _turn_signals, _build_ucns_envelope, _structural_signatures, _evaluate_relation, _digest",
              "#   internal_surface: _load_ucns, _verify_ucns_identity, _package_manifest, _split_turns, _turn_signals, _build_ucns_envelope, _structural_signatures, _flatten_structural_signatures, _evaluate_relation, _digest",
          )
          replace_once("import re\n", "import re\nimport subprocess\n")

          replace_once(
              '''@dataclass(frozen=True, slots=True)\nclass PolicyPreservationFinding:\n    pair_id: str\n    policy_name: str\n    readout: str\n    structures_equivalent: bool\n    readout_equivalent: bool\n    status: str\n    information_loss: tuple[str, ...]\n\n\n@dataclass(frozen=True, slots=True)\nclass ExperimentReport:''',
              '''@dataclass(frozen=True, slots=True)\nclass PolicyPreservationFinding:\n    pair_id: str\n    policy_name: str\n    readout: str\n    structures_equivalent: bool\n    readout_equivalent: bool\n    status: str\n    information_loss: tuple[str, ...]\n\n\n@dataclass(frozen=True, slots=True)\nclass StructuralSignatureRecord:\n    case_id: str\n    support_policy: str\n    policy_name: str\n    signature: str\n    information_loss: tuple[str, ...]\n\n\n@dataclass(frozen=True, slots=True)\nclass ExperimentReport:''',
          )
          replace_once(
              '''    edcm_commit: str\n    ucns_commit: str\n    cases: tuple[ExperimentCase, ...]\n    candidate_identities: tuple[tuple[str, str], ...]\n    readouts: tuple[CandidateReadout, ...]\n    relation_verdicts: tuple[RelationVerdict, ...]\n    policy_findings: tuple[PolicyPreservationFinding, ...]''',
              '''    edcm_commit: str\n    ucns_commit: str\n    ucns_source_manifest: str\n    ucns_identity_verified: bool\n    cases: tuple[ExperimentCase, ...]\n    candidate_identities: tuple[tuple[str, str], ...]\n    readouts: tuple[CandidateReadout, ...]\n    structural_signatures: tuple[StructuralSignatureRecord, ...]\n    relation_verdicts: tuple[RelationVerdict, ...]\n    policy_findings: tuple[PolicyPreservationFinding, ...]''',
          )
          replace_once(
              '''def _load_ucns() -> dict[str, Any]:\n    try:\n        from ucns import (''',
              '''def _load_ucns() -> dict[str, Any]:\n    try:\n        import ucns as ucns_package\n        from ucns import (''',
          )
          replace_once(
              '''    return locals()\n\n\ndef _build_ucns_envelope(''',
              '''    return locals()\n\n\ndef _ucns_package_dir(root: Path) -> Path:\n    root = root.resolve()\n    for candidate in (root / "src" / "ucns", root / "ucns", root):\n        if (candidate / "__init__.py").is_file():\n            return candidate\n    raise ValueError(f"UCNS package directory not found under {root}")\n\n\ndef _package_manifest(root: Path) -> str:\n    package_dir = _ucns_package_dir(root)\n    files = sorted(\n        file\n        for file in package_dir.rglob("*")\n        if file.is_file() and (file.suffix == ".py" or file.name == "py.typed")\n    )\n    if not files:\n        raise ValueError(f"UCNS package manifest is empty under {package_dir}")\n    digest = sha256()\n    for file in files:\n        relative = file.relative_to(package_dir).as_posix().encode("utf-8")\n        digest.update(relative)\n        digest.update(b"\\0")\n        digest.update(file.read_bytes())\n        digest.update(b"\\0")\n    return digest.hexdigest()\n\n\ndef _verify_ucns_identity(\n    source_root: Path, ucns_api: Mapping[str, Any]\n) -> tuple[str, str]:\n    source_root = source_root.resolve()\n    completed = subprocess.run(\n        ["git", "-C", str(source_root), "rev-parse", "HEAD"],\n        check=True,\n        capture_output=True,\n        text=True,\n    )\n    commit = completed.stdout.strip()\n    if commit != EXPECTED_UCNS_COMMIT:\n        raise ValueError(\n            f"UCNS checkout identity mismatch: expected {EXPECTED_UCNS_COMMIT}, got {commit}"\n        )\n    source_manifest = _package_manifest(source_root)\n    installed_root = Path(ucns_api["ucns_package"].__file__).resolve().parent\n    installed_manifest = _package_manifest(installed_root)\n    if installed_manifest != source_manifest:\n        raise ValueError(\n            "installed UCNS package bytes do not match the verified source checkout"\n        )\n    return commit, source_manifest\n\n\ndef _build_ucns_envelope(''',
          )
          replace_once(
              '''    return result\n\n\ndef _candidate_values_for_case(''',
              '''    return result\n\n\ndef _flatten_structural_signatures(\n    structural: Mapping[str, Mapping[str, Mapping[str, Any]]]\n) -> tuple[StructuralSignatureRecord, ...]:\n    return tuple(\n        StructuralSignatureRecord(\n            case_id,\n            support_policy,\n            policy_name,\n            str(payload["signature"]),\n            tuple(payload["losses"]),\n        )\n        for case_id in sorted(structural)\n        for support_policy in sorted(structural[case_id])\n        for policy_name, payload in sorted(structural[case_id][support_policy].items())\n    )\n\n\ndef _candidate_values_for_case(''',
          )
          replace_once(
              '''def run_default_experiments(\n    *, edcm_commit: str | None = None, ucns_commit: str = EXPECTED_UCNS_COMMIT\n) -> ExperimentReport:\n    """Run the fixed v0 joint experiment program.\n\n    The caller is responsible for installing UCNS from ``ucns_commit``. The\n    commit is recorded but cannot be inferred from package availability alone.\n    """''',
              '''def run_default_experiments(\n    *,\n    edcm_commit: str | None = None,\n    ucns_commit: str = EXPECTED_UCNS_COMMIT,\n    ucns_source_root: str | Path | None = None,\n) -> ExperimentReport:\n    """Run the fixed v0 joint experiment program.\n\n    A matching UCNS Git checkout is required. The runner verifies both the\n    checkout commit and the installed package bytes before recording identity.\n    """''',
          )
          replace_once(
              '''    ucns_api = _load_ucns()\n    comparison = ucns_api["combined_comparison_policy"](''',
              '''    source_root_value = ucns_source_root or os.environ.get("UCNS_SOURCE_ROOT")\n    if source_root_value is None:\n        raise ValueError(\n            "ucns_source_root or UCNS_SOURCE_ROOT is required for verified joint evidence"\n        )\n    ucns_api = _load_ucns()\n    verified_ucns_commit, ucns_source_manifest = _verify_ucns_identity(\n        Path(source_root_value), ucns_api\n    )\n    comparison = ucns_api["combined_comparison_policy"](''',
          )
          replace_once(
              '''        ("ucns-candidate-pack", f"The-Interdependency/ucns@{ucns_commit}"),''',
              '''        ("ucns-candidate-pack", f"The-Interdependency/ucns@{verified_ucns_commit}"),''',
          )
          replace_once(
              '''        edcm_commit or os.environ.get("GITHUB_SHA", "unrecorded-edcm-commit"),\n        ucns_commit,\n        cases,\n        candidate_identities,\n        tuple(all_readouts),\n        verdicts,''',
              '''        edcm_commit or os.environ.get("GITHUB_SHA", "unrecorded-edcm-commit"),\n        verified_ucns_commit,\n        ucns_source_manifest,\n        True,\n        cases,\n        candidate_identities,\n        tuple(all_readouts),\n        _flatten_structural_signatures(structural),\n        verdicts,''',
          )
          replace_once(
              '''    parser.add_argument("--ucns-commit", default=EXPECTED_UCNS_COMMIT)\n    args = parser.parse_args(argv)''',
              '''    parser.add_argument("--ucns-commit", default=EXPECTED_UCNS_COMMIT)\n    parser.add_argument("--ucns-source-root", type=Path, default=None)\n    args = parser.parse_args(argv)''',
          )
          replace_once(
              '''        edcm_commit=args.edcm_commit,\n        ucns_commit=args.ucns_commit,\n    )''',
              '''        edcm_commit=args.edcm_commit,\n        ucns_commit=args.ucns_commit,\n        ucns_source_root=args.ucns_source_root,\n    )''',
          )

          path.write_text(text, encoding="utf-8")

          for doc in (
              Path("CANON.md"),
              Path("README.md"),
              Path("AGENTS.md"),
              Path("docs/UCNS_EDCM_EXPERIMENT_PROGRAM.md"),
              Path("docs/ucns-adapter.md"),
          ):
              value = doc.read_text(encoding="utf-8")
              value = value.replace(
                  "python -m edcm.ucns_edcm_experiments --output",
                  "python -m edcm.ucns_edcm_experiments --ucns-source-root /path/to/ucns-checkout --output",
              )
              value = value.replace(
                  "python -m edcm.ucns_edcm_experiments \\\n  --output",
                  "python -m edcm.ucns_edcm_experiments \\\n  --ucns-source-root /path/to/ucns-checkout \\\n  --output",
              )
              doc.write_text(value, encoding="utf-8")
          PY

      - name: Install and verify corrected joint stack
        working-directory: edcm
        run: |
          python -m pip install --upgrade pip
          python -m pip install ../ucns
          python -m pip install -e .[dev]
          UCNS_SOURCE_ROOT=../ucns python -m pytest -q tests/test_ucns_edcm_experiments.py

      - name: Regenerate tracked metadata and report
        working-directory: edcm
        run: |
          PYTHONPATH=../skill-lib python ../skill-lib/msdmd/collect.py \
            --root . \
            --repo The-Interdependency/edcm \
            --out edcm_msdmd.ts
          mkdir -p experiments/results
          python -m edcm.ucns_edcm_experiments \
            --edcm-commit 5d15592d509a760ff9fbcdd346a2e749537bb2ba \
            --ucns-commit 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed \
            --ucns-source-root ../ucns \
            --output experiments/results/2026-07-21-ucns-edcm-v0.1.0.json
          python -m edcm.ucns_edcm_experiments \
            --edcm-commit 5d15592d509a760ff9fbcdd346a2e749537bb2ba \
            --ucns-commit 5331ae9a4cf7eddfa1de72b8caed28e2358cc0ed \
            --ucns-source-root ../ucns \
            --output /tmp/ucns-edcm-repeat.json
          diff -u experiments/results/2026-07-21-ucns-edcm-v0.1.0.json /tmp/ucns-edcm-repeat.json
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          report = json.loads(Path("experiments/results/2026-07-21-ucns-edcm-v0.1.0.json").read_text())
          findings = Path("docs/experiments/2026-07-21-initial-ucns-edcm-findings.md")
          text = findings.read_text()
          text = re.sub(
              r"\*\*Report digest:\*\* `[^`]+`",
              f"**Report digest:** `{report['report_digest']}`",
              text,
              count=1,
          )
          findings.write_text(text)
          PY
          rm .github/workflows/address-pr36-review-once.yml

      - name: Commit corrections and remove one-shot workflow
        working-directory: edcm
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add edcm/ucns_edcm_experiments.py \
            edcm_msdmd.ts \
            experiments/results/2026-07-21-ucns-edcm-v0.1.0.json \
            tests/test_ucns_edcm_experiments.py \
            .github/workflows/ucns-edcm-experiments.yml \
            CANON.md README.md AGENTS.md \
            docs/UCNS_EDCM_EXPERIMENT_PROGRAM.md \
            docs/ucns-adapter.md \
            docs/experiments/2026-07-21-initial-ucns-edcm-findings.md \
            .github/workflows/address-pr36-review-once.yml
          git commit -m "fix: verify UCNS identity and retain structural signatures"
          git push origin HEAD:agent/ucns-edcm-experiment-first
